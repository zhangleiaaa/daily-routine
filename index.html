<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2703d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日修行">
<title>每日修行</title>
<!-- 托管到 https 时这两个才生效，本地双击打开会 404，无妨 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2703d'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-dasharray='85 113' transform='rotate(-90 32 32)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2703d'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-dasharray='85 113' transform='rotate(-90 32 32)'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4f0; --card:#fffefb; --ink:#1c1b19; --muted:#8a857c;
  --line:#e6e2d9; --accent:#c2703d; --accent-soft:#f0e2d6;
  --ok:#5c8a5c; --warn:#c9a227; --err:#c05545;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141412; --card:#1e1e1b; --ink:#eceae4; --muted:#8f8a80;
    --line:#2e2d29; --accent:#d98a52; --accent-soft:#3a2c22;
    --ok:#7fae7f; --warn:#d9bc4a; --err:#d97a68;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding:max(18px,env(safe-area-inset-top)) 14px
          calc(48px + env(safe-area-inset-bottom)) 14px;
}
.wrap{max-width:560px;margin:0 auto}
button{font-family:inherit;font-size:15px;color:inherit;cursor:pointer;
  background:none;border:none;padding:0;touch-action:manipulation}

/* ---------- 同步条 ---------- */
.syncbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
  margin-bottom:16px;user-select:none;min-height:32px;width:100%;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn);animation:pulse 1s infinite}
.dot.err{background:var(--err)} .dot.off{background:var(--line)}
@keyframes pulse{50%{opacity:.3}}
#syncText{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncbar .gear{opacity:.6;flex:0 0 auto}

/* ---------- 头部 ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;margin-bottom:20px}
.date{font-size:13px;color:var(--muted);letter-spacing:.05em}
h1{font-size:26px;font-weight:600;letter-spacing:.02em;margin-top:2px}
.streak{font-size:13px;color:var(--muted);text-align:right;line-height:1.4;flex:0 0 auto}
.streak b{display:block;font-size:24px;color:var(--accent);font-weight:600}

/* ---------- 总进度 ---------- */
.overview{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px;margin-bottom:14px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:18px}
.ring{position:relative;width:84px;height:84px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sum{flex:1;font-size:13px;color:var(--muted);min-width:0}
.sum .big{font-size:16px;color:var(--ink);font-weight:600;margin-bottom:4px}
.sum .big span{color:var(--muted);font-weight:400;font-size:13px}

/* ---------- 任务卡 ---------- */
.task{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .25s}
.task.done{border-color:var(--ok)}
.task.running{border-color:var(--accent)}
.task .top{display:flex;align-items:center;gap:11px}
.name{flex:1;font-size:16px;font-weight:500;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.time{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);
  letter-spacing:.02em;white-space:nowrap;flex:0 0 auto}
.time b{color:var(--ink);font-weight:600}
.task.done .time b{color:var(--ok)}
.other{font-size:11.5px;color:var(--muted);opacity:.85;margin-top:6px}

/* 手指点得到：按钮实际触摸区 44px，视觉 38px */
.btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  position:relative;transition:background .15s,border-color .15s,transform .1s}
.btn::after{content:"";position:absolute;inset:-4px}
.btn:active{transform:scale(.9);background:var(--accent-soft)}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.play{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.play:active{background:var(--accent);opacity:.8}

.bar{height:5px;background:var(--line);border-radius:3px;margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.task.done .bar i{background:var(--ok)}

.tools{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:6px 13px;transition:all .15s}
.chip:active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- 底部 ---------- */
.acts{display:flex;gap:10px;margin:20px 0 24px}
.acts button{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;
  font-size:13.5px;color:var(--muted);background:var(--card)}
.acts button:active{border-color:var(--accent);color:var(--accent)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin-bottom:14px}

/* ---------- 历史 ---------- */
.hist-head{display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hist-head h2{margin:0}
.ranges{display:flex;gap:6px}
.rchip{font-size:12.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;transition:all .15s}
.rchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.hstats{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.7}
.hstats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* 一年视图列很多，让它在自己的容器里横向滚，别把整页撑宽 */
.heatwrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:4px;margin:0 -2px;padding-left:2px}
.months{display:grid;grid-auto-flow:column;gap:var(--cg);
  font-size:10px;color:var(--muted);height:13px;margin-bottom:3px}
.months span{white-space:nowrap;line-height:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cell));
  gap:var(--cg);width:max-content}
.heat i{display:block;width:var(--cell);height:var(--cell);
  border-radius:2.5px;background:var(--line);cursor:pointer}
.heat i.blank{background:transparent;cursor:default}
.heat i.sel{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

.daydetail{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.daydetail .dd-h{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:10px;gap:10px}
.daydetail .dd-h b{font-size:14px}
.daydetail .dd-h span{font-size:12px;color:var(--muted)}
.dd-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;
  font-size:13px;color:var(--muted)}
.dd-row b{color:var(--ink);font-weight:500;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-row .v{font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.dd-row.done .v{color:var(--ok)}
.dd-empty{color:var(--muted);font-size:12.5px}

/* ---------- 编辑 / 设置 ---------- */
.edit-row{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.edit-row input{font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.edit-row input.n{flex:1}
.edit-row input.m{width:70px;text-align:center;font-variant-numeric:tabular-nums}
.edit-row .del{color:var(--muted);font-size:22px;padding:4px 8px;line-height:1}
.edit-row .del:active{color:var(--err)}
.add{width:100%;border:1px dashed var(--line);border-radius:8px;padding:11px;
  font-size:13.5px;color:var(--muted);margin-top:4px}
.add:active{border-color:var(--accent);color:var(--accent)}

/* font-size 16px 以下 iOS/安卓会自动放大页面，别改小 */
.field{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:16px;
  color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:11px;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.85}
.hint code{background:var(--bg);padding:2px 5px;border-radius:4px;font-size:11.5px;word-break:break-all}
.hint a{color:var(--accent)}
.sect{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.sect h2{margin-bottom:10px}
.sw{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);
  padding:6px 0;cursor:pointer;user-select:none}
.sw input{width:19px;height:19px;accent-color:var(--accent);flex:0 0 auto}
.row{display:flex;gap:8px;margin-top:12px}
.primary{flex:1;background:var(--accent);color:#fff;border-radius:8px;padding:12px;font-size:14px}
.primary:active{opacity:.85}
.ghost{border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--muted)}
.ghost:active{border-color:var(--err);color:var(--err)}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-size:13.5px;
  padding:11px 20px;border-radius:999px;opacity:0;transition:all .3s;
  pointer-events:none;max-width:88vw;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:380px){
  .tools .chip{padding:6px 10px;font-size:12px}
  h1{font-size:23px}
}
</style>
</head>
<body>
<div class="wrap">

  <button class="syncbar" id="syncbar">
    <span class="dot off" id="dot"></span>
    <span id="syncText">未连接</span>
    <span class="gear">设置</span>
  </button>

  <div id="settings" class="panel hide"></div>

  <header>
    <div>
      <div class="date" id="date"></div>
      <h1>每日修行</h1>
    </div>
    <div class="streak">连续<b id="streak">0</b>天</div>
  </header>

  <div class="overview">
    <div class="ring">
      <svg width="84" height="84">
        <circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="7"/>
        <circle id="arc" cx="42" cy="42" r="36" fill="none" stroke="var(--accent)"
                stroke-width="7" stroke-linecap="round" stroke-dasharray="226.2"
                stroke-dashoffset="226.2" style="transition:stroke-dashoffset .5s ease"/>
      </svg>
      <div class="val" id="pct">0%</div>
    </div>
    <div class="sum">
      <div class="big" id="sumTime">0 分钟 <span>/ 0 分钟</span></div>
      <div id="sumTask">今天还没开始</div>
    </div>
  </div>

  <div id="list"></div>

  <div id="editor" class="panel hide" style="margin-top:14px">
    <h2>编辑任务</h2>
    <div id="editRows"></div>
    <button class="add" id="addTask">+ 添加一项</button>
  </div>

  <div class="acts">
    <button id="toggleEdit">编辑任务</button>
    <button id="resetDay">重置今天</button>
  </div>

  <div class="panel" style="margin-bottom:0">
    <div class="hist-head">
      <h2>历史</h2>
      <div class="ranges" id="ranges">
        <button class="rchip on" data-r="30">30 天</button>
        <button class="rchip" data-r="90">90 天</button>
        <button class="rchip" data-r="365">一年</button>
        <button class="rchip" data-r="all">全部</button>
      </div>
    </div>
    <div class="hstats" id="hstats"></div>
    <div class="heatwrap">
      <div id="heatInner">
        <div class="months" id="months"></div>
        <div class="heat" id="heat"></div>
      </div>
    </div>
    <div class="legend">
      <span>少</span>
      <i style="background:var(--line)"></i>
      <i style="background:var(--accent);opacity:.3"></i>
      <i style="background:var(--accent);opacity:.6"></i>
      <i style="background:var(--accent)"></i>
      <span>全部完成</span>
    </div>
    <div class="daydetail hide" id="dayDetail"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 常量 ================= */
const LS       = 'daily_routine_v2';
const LS_TOKEN = 'daily_routine_token';
const LS_GIST  = 'daily_routine_gist';
const LS_DEV   = 'daily_routine_device';
const LS_RUN   = 'daily_routine_running';
const LS_WAKE  = 'daily_routine_wakelock';
const GIST_FILE = 'daily-routine.json';
const GIST_DESC = 'daily-routine sync — 每日修行数据，请勿删除';
const API = 'https://api.github.com';

// 单次间隔超过这个就当作设备休眠 / 长时间没管，不计入
const MAX_GAP = 6 * 3600;

// 链接里带 token 时（.../#token=ghp_xxx）自动存下来，并马上把它从地址栏抹掉。
// 这样手机上点一下私人链接就配置好了，不用手输；
// 而托管在公开仓库里的文件本身不含任何密钥。
function tokenFromUrl() {
  const m = (location.hash + '&' + location.search).match(/[#&?]token=([A-Za-z0-9_]{20,})/);
  if (!m) return '';
  try { localStorage.setItem(LS_TOKEN, m[1]); } catch (e) {}
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  return m[1];
}

const DEFAULTS = [
  { name: '花生视频', target: 60 },
  { name: '练字',     target: 10 },
  { name: '朗读',     target: 15 },
  { name: '冥想',     target: 15 },
  { name: '陪伴孩子', target: 30 },
];

const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => dkey(new Date());
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);

let DEV = localStorage.getItem(LS_DEV);
if (!DEV) { DEV = uid(); localStorage.setItem(LS_DEV, DEV); }

/* =================== 数据模型 ===================
state = {
  v: 2,
  tasks: [{ k, name, target, at, ord }],   // at = 这一条自己的修改时间，ord = 排序
  dead:  { k: 删除时间 },                   // 删除墓碑
  days: {
    'YYYY-MM-DD': {
      goals: { k: 分钟 },                // 当天目标快照
      p: { k: { epoch, dev: { 设备id: {s: 秒, at: 时间戳} } } }
    }
  },
  legacy: { 'YYYY-MM-DD': 完成率 }
}
每台设备只写自己那份 dev[DEV]，合并时相加而不是互相覆盖。
清零 / 标记完成 会把 epoch 推到当前时间，早于 epoch 的贡献一律作废。
任务清单按单条合并：谁改得晚谁说了算，删除靠墓碑，见 merge()。
================================================== */

// 默认任务用固定 key。用随机 key 的话，两台新设备各生成一套，
// 合并后会变成两份重复的任务。
function blank() {
  return {
    v: 2, tasksAt: 0, days: {}, legacy: {}, dead: {},
    // at 全为 0 = 还没被人动过。只要别处有真正编辑过的清单，这份就整个让位。
    tasks: DEFAULTS.map((t, i) => ({ k: 'd' + (i + 1), ...t, at: 0, ord: i })),
  };
}

// 老数据里每条任务没有自己的 at，用整份清单的 tasksAt 顶上
function normTasks(s) {
  const base = s.tasksAt || 0;
  return (s.tasks || []).map((t, i) => ({
    k: t.k, name: t.name, target: t.target,
    at:  t.at  != null ? t.at  : base,
    ord: t.ord != null ? t.ord : i,
  }));
}

function load() {
  let s; try { s = JSON.parse(localStorage.getItem(LS)); } catch(e) { s = null; }
  if (!s || s.v !== 2) s = blank();
  s.days = s.days || {}; s.legacy = s.legacy || {}; s.dead = s.dead || {};
  s.tasks = normTasks(s);          // 补齐每条任务的 at / ord
  return s;
}

let state = load();
let running = null;          // 正在计时的任务 k
let lastTick = Date.now();
let dirty = false;

function saveLocal() { localStorage.setItem(LS, JSON.stringify(state)); }
function touch() { dirty = true; saveLocal(); }

function ensureDay(k = today()) {
  const d = state.days[k] || (state.days[k] = { goals:{}, p:{} });
  if (k === today()) {
    // 当天的目标快照按现有任务重建。只加不删的话，
    // 删掉一个已计时的任务后它仍留在分母里，百分比会一直虚高。
    // 过去的日子保留当时的快照，不动。
    const live = new Set(state.tasks.map(t => t.k));
    d.goals = {};
    state.tasks.forEach(t => d.goals[t.k] = t.target);
    for (const key in d.p) if (!live.has(key)) delete d.p[key];
  }
  return d;
}

function val(k, dateKey = today()) {
  const e = state.days[dateKey]?.p?.[k];
  if (!e) return 0;
  let sum = 0;
  for (const id in e.dev) if (e.dev[id].at >= (e.epoch || 0)) sum += e.dev[id].s;
  return Math.max(0, sum);
}
function valOther(k) {
  const e = state.days[today()]?.p?.[k];
  if (!e) return 0;
  let sum = 0;
  for (const id in e.dev) if (id !== DEV && e.dev[id].at >= (e.epoch || 0)) sum += e.dev[id].s;
  return Math.max(0, sum);
}

function addSec(k, sec) {
  if (!(sec > 0) && !(sec < 0)) return;
  const day = ensureDay();
  const e = day.p[k] || (day.p[k] = { epoch:0, dev:{} });
  const mine = e.dev[DEV] || (e.dev[DEV] = { s:0, at:0 });
  if (sec < 0 && mine.s + sec < 0) { setSec(k, val(k) + sec); return; }
  mine.s = Math.max(0, mine.s + sec);
  mine.at = Date.now();
  touch();
}
function setSec(k, sec) {
  const day = ensureDay();
  const now = Date.now();
  day.p[k] = { epoch: now, dev: { [DEV]: { s: Math.max(0, sec), at: now } } };
  touch();
}

/* ---------- 合并（本地 ⊕ 云端） ---------- */
function merge(a, b) {
  const out = { v:2, tasks:[], tasksAt:0, days:{}, legacy:{}, dead:{} };

  /* 任务清单按单条合并。
     以前是整份后写覆盖，有两个后果：
       · 一台刚装好的设备（换网址、清缓存）带着"当前时间"的清单一上来，
         就把你真正的编辑全盖掉了；
       · 某台设备拿着旧清单改一下，会把别处新增的任务连带抹掉。
     现在每条任务各带修改时间，谁改得晚谁说了算；删除留墓碑。 */
  let listA = normTasks(a), listB = normTasks(b);
  const realA = listA.some(t => t.at > 0);
  const realB = listB.some(t => t.at > 0);
  // 没人动过的默认清单，遇到真正编辑过的一方就整个让位，
  // 免得默认任务和用户任务混在一起变成重复项
  if (realA && !realB) listB = [];
  if (realB && !realA) listA = [];

  const byK = {};
  for (const t of listA) byK[t.k] = t;
  for (const t of listB) { const p = byK[t.k]; if (!p || t.at > p.at) byK[t.k] = t; }

  const dead = { ...(a.dead || {}) };
  for (const k in (b.dead || {})) dead[k] = Math.max(dead[k] || 0, b.dead[k]);
  out.dead = dead;
  out.tasks = Object.values(byK)
    .filter(t => !((dead[t.k] || 0) > t.at))     // 删除时间晚于最后修改 → 确实删了
    .sort((x, y) => (x.ord - y.ord) || (x.at - y.at));
  out.tasksAt = Math.max(a.tasksAt || 0, b.tasksAt || 0);

  for (const d in (a.legacy||{})) out.legacy[d] = a.legacy[d];
  for (const d in (b.legacy||{})) out.legacy[d] = Math.max(out.legacy[d]||0, b.legacy[d]);
  const dates = new Set([...Object.keys(a.days||{}), ...Object.keys(b.days||{})]);
  for (const dt of dates) {
    const da = a.days?.[dt], db = b.days?.[dt];
    if (!da || !db) { out.days[dt] = da || db; continue; }
    const day = { goals: { ...(da.goals||{}), ...(db.goals||{}) }, p:{} };
    const keys = new Set([...Object.keys(da.p||{}), ...Object.keys(db.p||{})]);
    for (const k of keys) {
      const ea = da.p?.[k], eb = db.p?.[k];
      if (!ea || !eb) { day.p[k] = ea || eb; continue; }
      const e = { epoch: Math.max(ea.epoch||0, eb.epoch||0), dev:{} };
      const ids = new Set([...Object.keys(ea.dev||{}), ...Object.keys(eb.dev||{})]);
      for (const id of ids) {
        const xa = ea.dev?.[id], xb = eb.dev?.[id];
        e.dev[id] = !xa ? xb : !xb ? xa : (xb.at > xa.at ? xb : xa);
      }
      day.p[k] = e;
    }
    out.days[dt] = day;
  }
  const cut = new Date(); cut.setDate(cut.getDate() - 400);
  const cutK = dkey(cut);
  for (const dt in out.days)   if (dt < cutK) delete out.days[dt];
  for (const dt in out.legacy) if (dt < cutK) delete out.legacy[dt];
  // 墓碑也别攒着；400 天后所有设备早就同步过了
  const cutMs = Date.now() - 400 * 24 * 3600 * 1000;
  for (const k in out.dead) if (out.dead[k] < cutMs) delete out.dead[k];
  return out;
}

/* ================= GitHub Gist 同步 ================= */
let token  = tokenFromUrl() || localStorage.getItem(LS_TOKEN) || '';
let gistId = localStorage.getItem(LS_GIST)  || '';
let syncing = false, lastPush = 0, lastOk = 0, syncErr = '';

const configured = () => !!token && !!gistId;

async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: {
    'Accept':'application/vnd.github+json',
    'Authorization':'Bearer ' + token,
    'X-GitHub-Api-Version':'2022-11-28',
    ...(opts.headers || {}),
  }});
  if (!r.ok) {
    const body = await r.text().catch(()=>'');
    let msg = r.status === 401 ? 'token 无效或已过期'
            : r.status === 403 ? '被拒绝（token 要勾 gist 权限）'
            : r.status === 404 ? '找不到 Gist' : `GitHub ${r.status}`;
    try { const j = JSON.parse(body); if (j.message) msg += '：' + j.message; } catch(e){}
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}
async function findOrCreateGist() {
  const list = await api('/gists?per_page=100');
  const hit = list.find(g => g.files && g.files[GIST_FILE]);
  if (hit) return hit.id;
  const g = await api('/gists', { method:'POST', body: JSON.stringify({
    description: GIST_DESC, public:false,
    files: { [GIST_FILE]: { content: JSON.stringify(state) } },
  })});
  return g.id;
}
async function remoteGet() {
  const g = await api('/gists/' + gistId);
  const f = g.files?.[GIST_FILE];
  if (!f) return null;
  const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  const d = JSON.parse(text);
  return (d && d.v === 2) ? d : null;
}
async function remotePut(d) {
  await api('/gists/' + gistId, { method:'PATCH', body: JSON.stringify({
    files: { [GIST_FILE]: { content: JSON.stringify(d) } },
  })});
}

async function sync() {
  if (!configured() || syncing) return;
  syncing = true; syncErr = ''; paintSync();
  try {
    const remote = await remoteGet();
    if (remote) {
      const merged = merge(state, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(state);
      state = merged;
      ensureDay();               // 对面删过任务的话，在这里把当天的残留清掉
      saveLocal();
      if (changed) render();
    }
    await remotePut(state);
    dirty = false; lastPush = Date.now(); lastOk = Date.now();
  } catch (e) {
    syncErr = e.message || String(e);
    if (!navigator.onLine) syncErr = '离线，数据已存本机';
  } finally {
    syncing = false; paintSync();
  }
}

/* 计时中每秒都在 touch，debounce 会被一直推迟，
   所以另外规定：脏数据最多攒 45 秒必须推一次。 */
let pushTimer = null;
function scheduleSync() {
  if (!configured()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(sync, 3000);
  if (dirty && Date.now() - lastPush > 45000) sync();
}

function paintSync() {
  const dot = document.getElementById('dot');
  const txt = document.getElementById('syncText');
  let cls = 'off', s;
  if (!configured())      { s = '未连接云同步（点这里设置）'; }
  else if (syncing)       { cls = 'busy'; s = '同步中…'; }
  else if (syncErr)       { cls = 'err';  s = syncErr; }
  else if (lastOk)        { cls = 'ok';   s = '已同步 · ' + ago(lastOk); }
  else                    { cls = 'busy'; s = '等待同步…'; }
  dot.className = 'dot ' + cls;
  txt.textContent = s;
}
function ago(t) {
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s/60) + ' 分钟前';
  return Math.floor(s/3600) + ' 小时前';
}

async function doConnect() {
  const t = document.getElementById('tokenIn').value.trim();
  if (!t) { toast('请先粘贴 token'); return; }
  token = t; syncing = true; syncErr = ''; paintSync();
  try {

    localStorage.setItem(LS_TOKEN, token);
    localStorage.setItem(LS_GIST, gistId);
    syncing = false;
    await sync();
    paintGistInfo(); toast('连接成功，数据已同步');
    document.getElementById('settings').classList.add('hide');
  } catch (e) {
    syncing = false; syncErr = e.message; paintSync();
    toast('连接失败：' + e.message);
    token = ''; gistId = '';

}
function doDisconnect() {
  if (!confirm('断开后本机不再同步，云端数据保留。确定？')) return;
  token = ''; gistId = ''; lastOk = 0; syncErr = '';
  localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_GIST);
  const i = document.getElementById('tokenIn'); if (i) i.value = '';
  paintSync(); paintGistInfo(); toast('已断开');
}

/* ================= 渲染 ================= */
const ICON = {
  play:  '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = sec => {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${m}:${String(s).padStart(2,'0')}`;
};

// 整块重建。每秒跳秒数走 paintProgress，不然手机上
// 每秒重建一次 DOM 会吃掉点击、也费电。
function render() {
  const d = new Date();
  const week = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('date').textContent = `${d.getMonth()+1} 月 ${d.getDate()} 日 · ${week}`;

  const list = document.getElementById('list');
  list.innerHTML = '';
  state.tasks.forEach(t => {
    const goal = t.target * 60, spent = val(t.k), other = valOther(t.k);
    const done = spent >= goal, isRun = running === t.k;
    const el = document.createElement('div');
    el.className = 'task' + (done ? ' done' : '') + (isRun ? ' running' : '');
    el.dataset.k = t.k;
    el.innerHTML = `
      <div class="top">
        <button class="btn ${isRun ? '' : 'play'}" data-act="toggle" data-k="${t.k}"
                aria-label="${isRun ? '暂停' : '开始'}">${isRun ? ICON.pause : ICON.play}</button>
        <div class="name">${esc(t.name)}</div>
        <div class="time"><b>${fmt(spent)}</b> / ${t.target} 分钟</div>
        <button class="btn" data-act="done" data-k="${t.k}" aria-label="标记完成"
                style="${done ? 'color:var(--ok);border-color:var(--ok)' : ''}">${ICON.check}</button>
      </div>
      <div class="bar"><i style="width:${Math.min(100, spent/goal*100)}%"></i></div>
      <div class="other" ${other > 0 ? '' : 'hidden'}>其中别的设备 ${fmt(other)}</div>
      <div class="tools">
        <button class="chip" data-act="add" data-k="${t.k}" data-v="300">+5 分钟</button>
        <button class="chip" data-act="add" data-k="${t.k}" data-v="-300">−5 分钟</button>
        <button class="chip" data-act="clear" data-k="${t.k}">清零</button>
      </div>`;
    list.appendChild(el);
  });
  paintProgress();
  document.getElementById('streak').textContent = calcStreak();
  renderHistory();
  paintSync();
}

// 每秒只改数字和进度条，不动 DOM 结构
function paintProgress() {
  let goalAll = 0, doneAll = 0, finished = 0;
  state.tasks.forEach(t => {
    const goal = t.target*60, spent = val(t.k), other = valOther(t.k);
    goalAll += goal; doneAll += Math.min(spent, goal);
    if (spent >= goal) finished++;
    const card = document.querySelector(`.task[data-k="${t.k}"]`);
    if (!card) return;
    card.querySelector('.time b').textContent = fmt(spent);
    card.querySelector('.bar i').style.width = Math.min(100, spent/goal*100) + '%';
    const o = card.querySelector('.other');
    if (other > 0) { o.hidden = false; o.textContent = `其中别的设备 ${fmt(other)}`; }
    else o.hidden = true;
    card.classList.toggle('done', spent >= goal);
    card.classList.toggle('running', running === t.k);
  });
  const rate = goalAll ? doneAll/goalAll : 0;
  document.getElementById('arc').style.strokeDashoffset = 226.2 * (1 - rate);
  document.getElementById('pct').textContent = Math.round(rate*100) + '%';
  document.getElementById('sumTime').innerHTML =
    `${Math.round(doneAll/60)} 分钟 <span>/ ${Math.round(goalAll/60)} 分钟</span>`;
  document.getElementById('sumTask').textContent =
    (finished === state.tasks.length && state.tasks.length)
      ? '今天全部完成，去休息吧' : `已完成 ${finished} / ${state.tasks.length} 项`;
  document.title = running ? `▶ ${fmt(val(running))} · 每日修行` : '每日修行';
}

function dayRate(k) {
  const day = state.days[k];
  if (!day) return state.legacy[k] || 0;
  const goals = day.goals || {};
  let g = 0, s = 0;
  for (const key in goals) {
    const goal = goals[key] * 60;
    g += goal; s += Math.min(val(key, k), goal);
  }
  if (!g) return state.legacy[k] || 0;
  return Math.max(s/g, state.legacy[k] || 0);
}

function calcStreak() {
  let n = 0;
  const d = new Date();
  if (dayRate(today()) > 0) n++; else d.setDate(d.getDate() - 1);
  for (;;) {
    if (n > 0) d.setDate(d.getDate() - 1);
    if (dayRate(dkey(d)) > 0) n++; else break;
    if (n > 3650) break;
  }
  return n;
}

/* ================= 历史 ================= */
let histRange = 30;      // 30 | 90 | 365 | 'all'
let selDate = null;      // 点开看明细的那天

// 有记录的最早一天；一条都没有就返回今天
function firstRecorded() {
  const keys = [...Object.keys(state.days), ...Object.keys(state.legacy)].sort();
  return keys.length ? keys[0] : today();
}

// 区间内的日期，从早到晚
function rangeDates() {
  const end = new Date(); end.setHours(0,0,0,0);
  let start;
  if (histRange === 'all') {
    start = new Date(firstRecorded() + 'T00:00:00');
    if (isNaN(start)) start = new Date(end);
    // 至少显示两周，不然只记了一天时那张图会小得看不清
    const min = new Date(end); min.setDate(min.getDate() - 13);
    if (start > min) start = min;
  } else {
    start = new Date(end); start.setDate(start.getDate() - (histRange - 1));
  }
  const out = [];
  for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) out.push(dkey(d));
  return out;
}

function renderHistory() {
  const dates = rangeDates();
  const cell = dates.length > 120 ? 10 : dates.length > 45 ? 13 : 15;
  const gap  = dates.length > 120 ? 3 : 4;
  const inner = document.getElementById('heatInner');
  inner.style.setProperty('--cell', cell + 'px');
  inner.style.setProperty('--cg', gap + 'px');

  // 区间统计
  let hit = 0, sumRate = 0, sumSec = 0;
  dates.forEach(k => {
    const r = dayRate(k);
    if (r > 0) hit++;
    sumRate += Math.min(1, r);
    const day = state.days[k];
    if (day) for (const key in (day.p || {})) sumSec += val(key, k);
  });
  const avg = dates.length ? Math.round(sumRate / dates.length * 100) : 0;
  const hrs = sumSec / 3600;
  document.getElementById('hstats').innerHTML =
    `共 <b>${dates.length}</b> 天　打卡 <b>${hit}</b> 天　平均 <b>${avg}%</b>　` +
    `累计 <b>${hrs >= 10 ? Math.round(hrs) : hrs.toFixed(1)}</b> 小时`;

  // 补齐成整周（周日起），这样按列排下来每行就是固定的星期几
  const pad = new Date(dates[0] + 'T00:00:00').getDay();
  const slots = new Array(pad).fill(null).concat(dates);
  while (slots.length % 7) slots.push(null);

  const box = document.getElementById('heat');
  box.innerHTML = '';
  slots.forEach(k => {
    const c = document.createElement('i');
    if (!k) { c.className = 'blank'; box.appendChild(c); return; }
    const rate = dayRate(k);
    if (rate > 0) {
      c.style.background = 'var(--accent)';
      c.style.opacity = (0.25 + Math.min(1, rate) * 0.75).toFixed(2);
    }
    if (k === selDate) c.className = 'sel';
    c.dataset.d = k;
    c.title = `${k} · ${Math.round(rate*100)}%`;
    box.appendChild(c);
  });

  // 月份标签：每列取该列第一天，月份变了就打一个
  const months = document.getElementById('months');
  months.innerHTML = '';
  let prev = '';
  for (let col = 0; col < slots.length / 7; col++) {
    const s = document.createElement('span');
    const k = slots[col*7] || slots[col*7 + 6];
    if (k) {
      const m = k.slice(0, 7);
      if (m !== prev) { s.textContent = (+k.slice(5,7)) + '月'; prev = m; }
    }
    months.appendChild(s);
  }

  renderDayDetail();
}

function renderDayDetail() {
  const box = document.getElementById('dayDetail');
  if (!selDate) { box.classList.add('hide'); return; }
  box.classList.remove('hide');

  const day = state.days[selDate];
  const goals = day?.goals || {};
  const keys = Object.keys(goals);
  const rate = Math.round(dayRate(selDate) * 100);
  const [y, m, dd] = selDate.split('-');
  const wk = ['周日','周一','周二','周三','周四','周五','周六'][new Date(selDate + 'T00:00:00').getDay()];

  let rows;
  if (!keys.length) {
    rows = state.legacy[selDate]
      ? `<div class="dd-empty">这天有记录，但没留下分项明细</div>`
      : `<div class="dd-empty">这天没有记录</div>`;
  } else {
    rows = keys.map(k => {
      const t = state.tasks.find(x => x.k === k);
      const name = t ? t.name : '（已删除的任务）';
      const spent = val(k, selDate), goal = goals[k] * 60;
      return `<div class="dd-row ${spent >= goal ? 'done' : ''}">
                <b>${esc(name)}</b>
                <span class="v">${fmt(spent)} / ${goals[k]} 分钟</span>
              </div>`;
    }).join('');
  }

  box.innerHTML = `
    <div class="dd-h">
      <b>${+m} 月 ${+dd} 日 · ${wk}</b>
      <span>${y} 年　完成 ${rate}%</span>
    </div>${rows}`;
}

document.getElementById('ranges').addEventListener('click', e => {
  const b = e.target.closest('.rchip');
  if (!b) return;
  histRange = b.dataset.r === 'all' ? 'all' : +b.dataset.r;
  [...document.querySelectorAll('.rchip')].forEach(x => x.classList.toggle('on', x === b));
  selDate = null;
  renderHistory();
});

document.getElementById('heat').addEventListener('click', e => {
  const c = e.target.closest('i[data-d]');
  if (!c) return;
  selDate = (selDate === c.dataset.d) ? null : c.dataset.d;   // 再点一次收起
  renderHistory();
});

/* ================= 计时 ================= */
// 手机锁屏 / 切后台时 setInterval 会停。所以时长一律按真实时钟算，
// 不能按"tick 了几次"算 —— 否则冥想 15 分钟锁着屏，回来只记几秒。
function saveRun() {
  if (running) localStorage.setItem(LS_RUN, JSON.stringify({ k: running, at: Date.now() }));
  else localStorage.removeItem(LS_RUN);
}

function startRun(k) { running = k; lastTick = Date.now(); saveRun(); scheduleAlarm(); }
function stopRun()    { running = null; saveRun(); scheduleAlarm(); }

// 把从 lastTick 到现在的真实时长记上；跨过目标就只补到刚好完成
function commit(now) {
  if (!running) { lastTick = now; return; }
  const t = state.tasks.find(x => x.k === running);
  if (!t) { stopRun(); return; }
  let delta = (now - lastTick) / 1000;
  lastTick = now;
  if (delta <= 0) return;
  if (delta > MAX_GAP) return;              // 设备睡了太久，这段不算

  const goal = t.target * 60, cur = val(t.k);
  if (cur < goal && cur + delta >= goal) {
    addSec(t.k, goal - cur);                // 只补到达标为止，多的不算
    stopRun();
    onComplete(t);
    render(); scheduleSync();
  } else {
    addSec(t.k, delta);
  }
}

let curDate = today();
setInterval(() => {
  const now = Date.now();
  if (curDate !== today()) {                // 跨过午夜
    commit(now); curDate = today(); stopRun();
    ensureDay(); touch(); render(); scheduleSync();
    return;
  }
  commit(now);
  paintProgress();
  if (dirty && now - lastPush > 45000) sync();
}, 1000);

/* ================= 交互 ================= */
document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const k = btn.dataset.k;
  const t = state.tasks.find(x => x.k === k);
  if (!t) return;

  commit(Date.now());                       // 切换前先把已跑的时间落账
  switch (btn.dataset.act) {
    case 'toggle':
      if (running === k) stopRun();
      // 借这一下点击解锁音频、顺便要通知权限，之后才能在后台响
      else { unlockAudio(); askNotify(); startRun(k); }
      break;
    case 'done':
      setSec(k, val(k) >= t.target*60 ? 0 : t.target*60);
      if (running === k) stopRun();
      break;
    case 'add':  addSec(k, +btn.dataset.v); break;
    case 'clear':
      setSec(k, 0);
      if (running === k) stopRun();
      break;
  }
  render(); scheduleSync();
  scheduleAlarm();          // +5/清零/标记完成都会改变剩余时长，闹钟要重挂
});

document.getElementById('toggleEdit').onclick = () => {
  const ed = document.getElementById('editor');
  ed.classList.toggle('hide');
  document.getElementById('toggleEdit').textContent =
    ed.classList.contains('hide') ? '编辑任务' : '完成编辑';
  if (!ed.classList.contains('hide')) renderEditor();
};

function renderEditor() {
  const box = document.getElementById('editRows');
  box.innerHTML = '';
  state.tasks.forEach(t => {
    const row = document.createElement('div');
    row.className = 'edit-row';
    row.innerHTML = `
      <input class="n" value="${esc(t.name)}" placeholder="任务名">
      <input class="m" type="number" inputmode="numeric" min="1" max="600" value="${t.target}">
      <span style="font-size:12px;color:var(--muted)">分钟</span>
      <button class="del" aria-label="删除">×</button>`;
    const [nameIn, minIn] = row.querySelectorAll('input');
    // 改动只打在这一条上，不动别的任务 —— 否则会把别处的新增覆盖掉
    nameIn.oninput = () => {
      t.name = nameIn.value; t.at = Date.now();
      touch(); render(); scheduleSync();
    };
    minIn.onchange = () => {
      t.target = Math.max(1, Math.min(600, +minIn.value || 1));
      minIn.value = t.target; t.at = Date.now(); touch();
      render(); scheduleSync(); scheduleAlarm();     // 目标时长变了，闹钟要重挂
    };
    row.querySelector('.del').onclick = () => {
      if (!confirm(`删除「${t.name}」？`)) return;
      state.tasks = state.tasks.filter(x => x.k !== t.k);
      state.dead[t.k] = Date.now();       // 留墓碑，别的设备才知道这是删了不是没同步到
      if (running === t.k) stopRun();
      ensureDay(); touch(); render(); renderEditor(); scheduleSync();
    };
    box.appendChild(row);
  });
}

document.getElementById('addTask').onclick = () => {
  const ord = Math.max(-1, ...state.tasks.map(t => t.ord || 0)) + 1;
  state.tasks.push({ k: uid(), name: '新任务', target: 15, at: Date.now(), ord });
  touch(); render(); renderEditor(); scheduleSync();
  document.querySelector('#editRows .edit-row:last-child .n').select();
};

document.getElementById('resetDay').onclick = () => {
  if (!confirm('把今天所有任务的时间清零？（所有设备都会清）')) return;
  stopRun();
  state.tasks.forEach(t => setSec(t.k, 0));
  render(); scheduleSync(); toast('已重置');
};

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2400);
}

/* ================= 到点提醒 =================
   手机锁屏或切到别的 app 后，浏览器会冻结页面，setInterval 停摆，
   到点那一刻根本没有代码在跑 —— 所以光靠每秒的 tick 是响不了的。
   三层保险：
     1. 计时期间循环播一段无声音频，让系统认为页面在放东西，别冻结它
     2. 按剩余时长挂一个精确的 setTimeout，到点直接响 + 发系统通知
     3. 万一还是被冻结了，回到页面时按真实时钟补记，并补响一次
*/
let audioCtx = null, keepEl = null, alarmTimer = null, wakeLock = null;
let wakeOn = localStorage.getItem(LS_WAKE) === '1';

// 必须借用户点 ▶ 的那一下手势解锁音频，之后才允许出声
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}

// 现造一段 1 秒的无声 wav，省得依赖外部文件
function silentWav() {
  const rate = 8000, n = rate;
  const buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);      // 8 位无声 = 128
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

function keepAlive(on) {
  try {
    if (on) {
      if (keepEl) return;
      keepEl = new Audio(silentWav());
      keepEl.loop = true;
      keepEl.volume = 0.001;          // 真的填 0，有些机型会把它优化掉
      keepEl.play().catch(() => {});
    } else if (keepEl) {
      keepEl.pause(); keepEl.src = ''; keepEl = null;
    }
  } catch (e) {}
}

async function setWake(on) {
  try {
    if (on && 'wakeLock' in navigator) {
      if (!wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } else if (wakeLock) {
      const w = wakeLock; wakeLock = null; await w.release();
    }
  } catch (e) { wakeLock = null; }
}

// 按剩余时长挂一个精确闹钟；每次时长有变动都要重挂
function scheduleAlarm() {
  clearTimeout(alarmTimer); alarmTimer = null;
  if (!running) { keepAlive(false); setWake(false); return; }
  const t = state.tasks.find(x => x.k === running);
  if (!t) { keepAlive(false); setWake(false); return; }
  const left = t.target * 60 - val(t.k);
  if (left <= 0) return;
  keepAlive(true);
  setWake(wakeOn);        // 无条件同步，关掉常亮时也能把已申请的锁释放掉
  // 到点让 commit 去判定完成，跟正常路径走同一套逻辑
  alarmTimer = setTimeout(() => { commit(Date.now()); render(); }, left * 1000 + 200);
}

async function askNotify() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try { return (await Notification.requestPermission()) === 'granted'; } catch (e) { return false; }
}

function notify(name) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opt = {
    body: '这一项做完了',
    tag: 'daily-routine-done', renotify: true, requireInteraction: true,
    vibrate: [200, 100, 200, 100, 200],
    icon: 'icon-192.png', badge: 'icon-192.png',
  };
  // 安卓上必须经由 service worker 弹，直接 new Notification 会抛错
  if (navigator.serviceWorker && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready
      .then(r => r.showNotification(`${name} 完成了`, opt))
      .catch(() => { try { new Notification(`${name} 完成了`, opt); } catch (e) {} });
  } else {
    try { new Notification(`${name} 完成了`, opt); } catch (e) {}
  }
}

function ding() {
  try {
    unlockAudio();
    const ac = audioCtx;
    if (ac) {
      const t0 = ac.currentTime;
      for (let r = 0; r < 3; r++) {                 // 响三轮，一声容易漏听
        [880, 1320].forEach((f, i) => {
          const at = t0 + r * 0.75 + i * 0.18;
          const o = ac.createOscillator(), g = ac.createGain();
          o.frequency.value = f; o.type = 'sine';
          g.gain.setValueAtTime(0.0001, at);
          g.gain.exponentialRampToValueAtTime(0.5, at + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, at + 0.55);
          o.connect(g); g.connect(ac.destination);
          o.start(at); o.stop(at + 0.6);
        });
      }
    }
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) {}
}

function onComplete(t) { ding(); toast(`${t.name} 完成了`); notify(t.name); }

/* ================= 生命周期 ================= */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { commit(Date.now()); saveLocal(); saveRun(); }
  else {
    // 这里千万不能先重置 lastTick —— 那样时间差归零，
    // 切后台的这段时长就全丢了。直接 commit，让它按真实时钟补。
    commit(Date.now());
    render(); sync();
    scheduleAlarm();        // 后台期间挂的定时器可能已被系统清掉，重挂一次
    if (running && wakeOn) setWake(true);
  }
});
window.addEventListener('pagehide', () => { commit(Date.now()); saveLocal(); saveRun(); });
window.addEventListener('focus',  sync);
window.addEventListener('online', sync);
setInterval(() => { if (!document.hidden) sync(); }, 120000);
setInterval(paintSync, 30000);

document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  commit(Date.now());
  if (running) stopRun();
  else {
    const t = state.tasks.find(x => val(x.k) < x.target*60);
    if (t) startRun(t.k);
  }
  render();
});

/* ================= 启动 ================= */
ensureDay();

// 上次没停就被关掉了（手机上很常见：切走后系统把页面回收了）
// 按真实时钟把这段时间补回来，然后继续跑。
(function resumeRun() {
  let r; try { r = JSON.parse(localStorage.getItem(LS_RUN)); } catch(e) { r = null; }
  if (!r || !r.k || !state.tasks.some(t => t.k === r.k)) { localStorage.removeItem(LS_RUN); return; }
  const gap = (Date.now() - r.at) / 1000;
  if (gap <= 0 || gap > MAX_GAP) { localStorage.removeItem(LS_RUN); return; }
  running = r.k; lastTick = r.at;
  commit(Date.now());
  if (running) {
    saveRun(); scheduleAlarm();
    setTimeout(() => toast(`继续计时，已补上离开的 ${Math.round(gap/60)} 分钟`), 600);
  }
})();

render();
if (configured()) sync();

// 装上 service worker 才能离线打开、才算真正的 App。
// 只有 https 下浏览器才允许注册；本地双击打开时直接跳过。
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    // 发现新版本就装上，装好后下次打开自动生效
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          toast('已更新到新版本，下次打开生效');
        }
      });
    });
  }).catch(() => {});
}
</script>
</body>
</html>
